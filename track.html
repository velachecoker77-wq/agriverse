<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agriverse Africa - Track Bag</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#f0fdf4;margin:0;padding:16px;color:#111}
.card{max-width:460px;margin:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
h2{margin:0;color:#166534}
.top{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.badge{background:#dcfce7;color:#166534;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f3f4f6;font-size:14px}
.hash{font-size:10px;background:#f9fafb;padding:10px;border-radius:10px;word-break:break-all;margin-top:8px}
.ok{color:#166534;font-weight:800;text-align:cente
#qrcode{display:flex;justify-content:center;margin:16px 0}
</style>
</head>
<body>
<div class="card">
<h2>🌾 Agriverse Africa</h2>
<div class="top"><span id="bagLabel">Loading...</span><span class="badge">BLOCKCHAIN VERIFIED</span></div>
<div id="qrcode"></div>
<div id="content">Connecting to Moyamba...</div>
<div class="ok" id="ok"></div>
</div>
<script>
const SUPABASE_URL = "https://hyporvepyvqwvmvaesubf.supabase.co";
const SUPABASE_KEY = "sb_publishable_7tJyJbzOMMGibVwtFTnYWg_HeHh5jhs";
const bagCode = new URLSearchParams(location.search).get('bag') || 'AGV-001';
document.getElementById('bagLabel').innerText = bagCode;
async function load(){
 try{
  const res = await fetch(`${SUPABASE_URL}/rest/v1/bags?bag_code=eq.${bagCode}&select=*`,{
    headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}
  });
  const data = await res.json();
  if(!data.length){document.getElementById('content').innerHTML=`Bag <b>${bagCode}</b> not found`;return;}
  const b=data[0];
  document.getElementById('content').innerHTML=`
    <div class="row"><b>Crop</b><span>${b.crop_type}</span></div>
    <div class="row"><b>Weight</b><span>${b.weight}</span></div>
    <div class="row"><b>Origin</b><span>${b.origin_village}</span></div>
    <div class="row"><b>Destination</b><span>${b.destination}</span></div>
    <div class="row"><b>Status</b><span>${b.status}</span></div>
    <div class="row"><b>Farmer</b><span>${b.farmer_id}</span></div>
    <p style="margin:12px 0 4px;font-size:12px;font-weight:700">Blockchain Hash</p>
    <div class="hash">${b.blockchain_hash}</div>
  `;
  document.getElementById('ok').innerText="✅ Authentic • Verified on Agriverse Blockchain • Moyamba → Kenema";
  new QRCode(document.getElementById("qrcode"),{text:location.href,width:140,height:140});
 }catch(e){document.getElementById('content').innerHTML="Error: "+e.message}
}
load();
</script>
</body>
</html>
