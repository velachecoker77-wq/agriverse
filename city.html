<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freetown City - Agriverse</title>
<style>
body{margin:0;font-family:system-ui;background:#07130a;color:#fff;padding-bottom:80px}
header{padding:14px;background:#16a34a;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;color:#111;border-radius:18px;padding:14px;margin:12px auto;max-width:900px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#16a34a;color:#fff;font-weight:900;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.job{background:#f1f5f9;border-radius:12px;padding:10px;border:1px solid #ddd}
.map{height:280px;background:radial-gradient(#0f3d1a,#000);border-radius:16px;position:relative;overflow:hidden;border:2px solid #16a34a}
.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e}
.hero{background:linear-gradient(135deg,#16a34a,#065f46);border-radius:18px;padding:18px;margin:12px auto;max-width:900px;text-align:center}
</style>
</head>
<body>
<header><b>🏙️ Freetown City</b><a href="index.html" style="color:#fff;text-decoration:none">← Back to Market</a></header>
<div class="hero">
<h1>Welcome to Freetown City</h1>
<p>Virtual City inside Agriverse. Deliver Green Gold bags. Earn <b>$1 per delivery</b>.</p>
<p>🪙 Coins: <span id="coins">1240</span> | 💵 Wallet: $<span id="cash">12.50</span></p>
<button class="btn" style="background:#fff;color:#16a34a" onclick="document.getElementById('jobs').scrollIntoView({behavior:'smooth'})">🚀 Start Delivering Now</button>
</div>
<div class="card"><h3>🗺️ Live City Map</h3><div class="map"><div class="dot" style="left:30%;top:20%"></div><div class="dot" style="left:60%;top:40%;background:#facc15"></div><div class="dot" style="left:45%;top:70%"></div></div></div>
<div class="card" id="jobs"><h3>📦 Available Deliveries - Earn $1 Each</h3><div class="grid" id="jobGrid"></div></div>
<div class="card" style="text-align:center"><a href="index.html"><button class="btn">← Back to Green Gold Market</button></a></div>
<script>
let jobs=[{name:"Cassava 50kg",from:"Moyamba",to:"Congo Market"},{name:"Rice 50kg",from:"Bo",to:"Lumley"},{name:"Corn 50kg",from:"Kenema",to:"Kissy"},{name:"Cacao 30kg",from:"Kailahun",to:"Hill Station"}];
function renderJobs(){let g=document.getElementById('jobGrid');g.innerHTML="";jobs.forEach((j,i)=>{g.innerHTML+=`<div class=job><b>${j.name}</b><br><small>${j.from} → ${j.to}</small><br><b style="color:#16a34a">$1 reward</b><br><button onclick="deliver(${i})" style="margin-top:6px;width:100%;padding:8px;border:none;border-radius:8px;background:#16a34a;color:#fff;font-weight:800">✅ Deliver</button></div>`})}
function deliver(i){let coins=parseInt(localStorage.getItem('avCoins')||'1240');let cash=parseFloat(localStorage.getItem('avCash')||'12.50');coins+=50;cash+=1;localStorage.setItem('avCoins',coins);localStorage.setItem('avCash',cash.toFixed(2));document.getElementById('coins').innerText=coins;document.getElementById('cash').innerText=cash.toFixed(2);alert('Delivered '+jobs[i].name+'! +$1 +50 coins 🪙');jobs.splice(i,1);renderJobs();}
document.getElementById('coins').innerText=localStorage.getItem('avCoins')||'1240';document.getElementById('cash').innerText=localStorage.getItem('avCash')||'12.50';renderJobs();
</script>
</body>
</html>
