<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GTA FREETOWN v7 - NIGHT EDITION</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;font-family:'Segoe UI',system-ui;font-weight:800}
body{background:#020617;overflow:hidden;height:100vh;height:100dvh;color:white}
#game{position:absolute;inset:0}
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;padding:6px 8px;pointer-events:none}
.stat{background:rgba(0,0,0,.7);padding:5px 9px;border-radius:12px;font-size:11px;border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;gap:5px}
.wanted{color:#facc15;letter-spacing:2px}
.mission{position:absolute;top:48px;left:8px;right:120px;background:rgba(255,255,255,.95);color:black;border-radius:12px;padding:8px 10px;z-index:10;border-left:5px solid #16a34a}
.minimap{position:absolute;top:6px;right:6px;width:98px;height:98px;background:rgba(0,0,0,.85);border:2px solid rgba(255,255,255,.3);border-radius:10px;z-index:15;overflow:hidden}
.joystick{position:absolute;bottom:18px;left:14px;width:115px;height:115px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:50%;z-index:20}
.stick{position:absolute;top:50%;left:50%;width:48px;height:48px;background:white;border-radius:50%;transform:translate(-50%,-50%)}
.rightCtrls{position:absolute;bottom:18px;right:10px;z-index:20;display:flex;flex-direction:column;gap:8px}
.cbtn{width:58px;height:58px;border-radius:50%;border:none;font-weight:900;font-size:9px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;justify-content:center;align-items:center;z-index:100;padding:18px}.box{background:white;color:black;padding:18px;border-radius:18px;text-align:center;width:100%;max-width:340px}
.speedo{position:absolute;bottom:145px;right:12px;background:rgba(0,0,0,.7);padding:6px 10px;border-radius:20px;font-size:11px;z-index:15;border:1px solid rgba(255,255,255,.2)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="topbar">
<div style="display:flex;gap:6px"><div class="stat">❤️ <span id="health">100</span> 🛡️ <span id="armor">50</span></div><div class="stat wanted" id="wantedStars">☆☆☆☆☆</div></div>
<div style="display:flex;gap:6px"><div class="stat">💰 $<span id="cash">154620</span></div><div class="stat" style="color:#4ade80">🌴 LUMLEY</div></div>
</div>
<div class="minimap"><canvas id="mini" width="98" height="98"></canvas></div>
<div class="mission">
<div style="display:flex;justify-content:space-between;font-size:12px"><b>📦 <span id="jobName">Deliver Fish - Lumley → Cotton Tree</span></b><span id="dist" style="color:#16a34a">0m</span></div>
<div style="font-size:10px;color:#475569">🚗 Traffic • 👮 Police • 🌃 Night • ⛽ <span id="fuelT">100%</span></div>
<button id="delBtn" onclick="completeMission()" style="width:100%;padding:9px;margin-top:5px;border:none;border-radius:10px;background:#16a34a;color:white;font-weight:900;font-size:11px">🏁 DRIVE TO GREEN</button>
</div>
<div class="speedo">🛵 <span id="speed">0</span> KPH | ⛽ <span id="fuelBar">████</span></div>
<div class="joystick" id="joy"><div class="stick" id="stick"></div></div>
<div class="rightCtrls">
<div style="display:flex;gap:6px"><button class="cbtn" style="background:#facc15" onclick="honk()">🔊<br>HORN</button><button class="cbtn" style="background:#38bdf8;color:white" onclick="buyFuel()">⛽<br>FUEL</button></div>
<div style="display:flex;gap:6px"><button class="cbtn" style="background:#ef4444;color:white" onclick="toggleWanted()">🚨<br>WANTED</button><button class="cbtn" style="background:#22c55e;color:white" onclick="watchAd()">📺<br>AD</button></div>
</div>
<div class="modal" id="policeModal"><div class="box" style="border-top:6px solid #ef4444"><div style="font-size:36px">🚔💡👮‍♂️</div><h3>SLP CHECKPOINT @ NIGHT!</h3><p style="font-size:12px;margin:8px 0">"Okada! Night operation! Reflector? License? 100c or station!"<br><br>Siren dey flash! 🚨</p><div style="display:flex;gap:8px;margin-top:12px"><button style="flex:1;padding:13px;background:#ef4444;color:white;border:none;border-radius:12px;font-weight:900" onclick="payBribe()">💸 PAY 100c</button><button style="flex:1;padding:13px;background:#020617;color:white;border:none;border-radius:12px;font-weight:900" onclick="runPolice()">🏃 RUN NIGHT!</button></div></div></div>
<div class="modal" id="adModal"><div class="box"><h3>📺 Africell / Orange</h3><div id="adTimer" style="background:black;color:#facc15;padding:10px;border-radius:8px;margin:8px 0">5s</div><button id="adClose" style="display:none;width:100%;padding:10px;background:#16a34a;color:white;border:none;border-radius:10px" onclick="closeAd()">✅ CLAIM</button></div></div>
<script>
const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');const mini=document.getElementById('mini');const mctx=mini.getContext('2d');let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}resize();addEventListener('resize',resize);
let coins=1250,cash=154620,fuel=100,health=100,armor=50,wantedLevel=0,wanted=false;
let player={x:600,y:700,angle:0,vx:0,vy:0,wobble:0,speed:0};let keys={x:0,y:0};let sirenBlink=0;
let buildings=[{x:450,y:60,w:120,h:70,color:'#ff6a00',name:'Orange Money',glow:'#ff6a00'},{x:700,y:70,w:130,h:75,color:'#a855f7',name:'africell',glow:'#a855f7'},{x:500,y:280,w:140,h:90,color:'#334155',name:'SIERRA PALMS',type:'shop'},{x:480,y:520,w:130,h:80,color:'#334155',name:'COLA BAR',type:'shop'}];
let traffic=[];for(let i=0;i<8;i++) traffic.push({x:300+Math.random()*200,y:Math.random()*1000,angle:Math.PI/2, speed:0.8+Math.random()*1.2, color:['#facc15','#38bdf8','#f87171','#4ade80'][Math.floor(Math.random()*4)], type:Math.random()<0.3?'keke':'car'});
let policeCars=[{x:200,y:400,angle:0,vx:0,vy:0,active:false}];
let policeChecks=[{x:350,y:480,w:150,h:20},{x:480,y:80,w:20,h:420}];
let potholes=[];for(let i=0;i<22;i++) potholes.push({x:270+Math.random()*140,y:Math.random()*1200,r:7+Math.random()*10});
let palmTrees=[];for(let i=0;i<40;i++) palmTrees.push({x:170+Math.random()*90,y:Math.random()*1200,scale:0.7+Math.random()*0.7});
let streetLights=[];for(let i=0;i<30;i++) streetLights.push({x:430,y:i*80+20});
let mission={target:{x:900,y:150},rewardC:80,rewardD:2.5};let particles=[],cooldown=0;
function drawPalm(x,y,s,shadow=false){if(shadow){ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(x+12*s,y+16*s,20*s,7*s,0,0,6.28);ctx.fill();return}ctx.fillStyle='#3f2a14';ctx.fillRect(x-3*s,y-10*s,6*s,22*s);ctx.fillStyle='#15803d';for(let a=0;a<6;a++){let ang=a*Math.PI/3;ctx.beginPath();ctx.ellipse(x+Math.cos(ang)*13*s,y-14*s+Math.sin(ang)*4*s,14*s,5*s,ang,0,6.28);ctx.fill();}}
function updateHUD(){
 document.getElementById('cash').innerText=cash;document.getElementById('fuelT').innerText=Math.floor(fuel)+'%';document.getElementById('fuelBar').innerText='█'.repeat(Math.max(0,Math.floor(fuel/15)));
 document.getElementById('speed').innerText=Math.floor(player.speed*18);let stars='';for(let i=0;i<5;i++) stars+= i<wantedLevel?'★':'☆';document.getElementById('wantedStars').innerText=stars;
 let d=Math.hypot(mission.target.x-player.x,mission.target.y-player.y);document.getElementById('dist').innerText=Math.floor(d)+'m';
 let b=document.getElementById('delBtn');if(d<60){b.innerText='✅ DELIVER!';b.style.background='#22c55e';}else{b.innerText='🏁 DRIVE TO GREEN';b.style.background='#334155';}
}
let cam={x:0,y:0};
function draw(){
 sirenBlink+=0.25;cam.x+=(player.x - W/2 - cam.x)*0.08;cam.y+=(player.y - H/2 - cam.y)*0.08;
 ctx.fillStyle='#020617';ctx.fillRect(0,0,W,H);for(let i=0;i<60;i++){let sx=(i*137)%W,sy=(i*59)%(H*0.4);ctx.fillStyle='rgba(255,255,255,'+(0.3+Math.random()*0.4)+')';ctx.fillRect(sx,sy,1,1);}
 let oX=0 - cam.x;ctx.fillStyle='#0a192f';ctx.fillRect(oX,-1200 - cam.y,155,3500);ctx.fillStyle='#1a1a2e';ctx.fillRect(155 - cam.x,-1200 - cam.y,115,3500);
 ctx.fillStyle='#0f172a';ctx.fillRect(270 - cam.x,-1200 - cam.y,145,3500);ctx.strokeStyle='rgba(250,204,21,0.6)';ctx.setLineDash([22,22]);ctx.beginPath();ctx.moveTo(342 - cam.x,-1200 - cam.y);ctx.lineTo(342 - cam.x,2300 - cam.y);ctx.stroke();ctx.setLineDash([]);
 for(let ph of potholes){let sx=ph.x - cam.x,sy=ph.y - cam.y;ctx.fillStyle='#020617';ctx.beginPath();ctx.arc(sx,sy,ph.r,0,6.28);ctx.fill();ctx.fillStyle='rgba(125,211,252,0.3)';ctx.beginPath();ctx.arc(sx,sy,ph.r*0.5,0,6.28);ctx.fill();}
 for(let sl of streetLights){let sx=sl.x - cam.x,sy=sl.y - cam.y;if(sy>-100&&sy<H+100){ctx.fillStyle='rgba(251,191,36,0.25)';ctx.beginPath();ctx.arc(sx,sy,35,0,6.28);ctx.fill();ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(sx,sy,4,0,6.28);ctx.fill();}}
 for(let pt of palmTrees){let sx=pt.x - cam.x,sy=pt.y - cam.y;if(sx>-100&&sx<W+100&&sy>-100&&sy<H+100){drawPalm(sx,sy,pt.scale,true);drawPalm(sx,sy,pt.scale,false);}}
 for(let pc of policeChecks){let sx=pc.x - cam.x,sy=pc.y - cam.y;ctx.fillStyle=sirenBlink%2<1?'#ef4444':'#3b82f6';ctx.fillRect(sx,sy,pc.w,pc.h);}
 for(let b of buildings){let sx=b.x - cam.x,sy=b.y - cam.y;if(sx>-200&&sx<W+200&&sy>-200&&sy<H+200){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(sx+5,sy+5,b.w,b.h);ctx.fillStyle=b.color;ctx.fillRect(sx,sy,b.w,b.h);for(let wx=0;wx<3;wx++)for(let wy=0;wy<2;wy++){let on=Math.random()<0.7;ctx.fillStyle=on?'#fde047':'#1e293b';ctx.fillRect(sx+8+wx*28,sy+18+wy*20,18,12);}if(b.glow){ctx.shadowColor=b.glow;ctx.shadowBlur=20;ctx.fillStyle=b.glow;ctx.fillRect(sx,sy-8,b.w,10);ctx.shadowBlur=0;ctx.fillStyle='white';ctx.font='900 10px system-ui';ctx.fillText(b.name,sx+4,sy-2);}else{ctx.fillStyle='white';ctx.font='800 8px system-ui';ctx.fillText(b.name,sx+4,sy+10);}}}
 for(let t of traffic){let sx=t.x - cam.x,sy=t.y - cam.y;ctx.save();ctx.translate(sx,sy);ctx.rotate(t.angle);ctx.fillStyle=t.color;if(t.type==='keke'){ctx.fillRect(-10,-8,20,14);ctx.fillStyle='#facc15';ctx.fillRect(8,-4,4,8);}else{ctx.fillRect(-14,-7,28,14);}ctx.fillStyle='#fef08a';ctx.fillRect(12,-5,3,2);ctx.fillRect(12,3,3,2);ctx.fillStyle='#ef4444';ctx.fillRect(-14,-4,2,2);ctx.fillRect(-14,2,2,2);ctx.restore();}
 for(let p of policeCars){if(!p.active)continue;let sx=p.x - cam.x,sy=p.y - cam.y;ctx.save();ctx.translate(sx,sy);ctx.rotate(p.angle);ctx.fillStyle=sirenBlink%2<1?'#ef4444':'#3b82f6';ctx.fillRect(-16,-9,32,18);ctx.fillStyle='white';ctx.fillRect(-6,-11,12,4);ctx.fillStyle='#fef08a';ctx.fillRect(14,-5,3,2);ctx.fillRect(14,3,3,2);ctx.restore();}
 let tx=mission.target.x - cam.x,ty=mission.target.y - cam.y;ctx.beginPath();ctx.arc(tx,ty,42,0,6.28);ctx.fillStyle='rgba(34,197,94,.25)';ctx.fill();ctx.strokeStyle='#22c55e';ctx.lineWidth=3;ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);ctx.font='900 26px system-ui';ctx.fillText('📦',tx-13,ty+9);
 let px=W/2+(Math.random()-0.5)*player.wobble,py=H/2+(Math.random()-0.5)*player.wobble;ctx.save();ctx.translate(px,py);ctx.rotate(player.angle);
 ctx.fillStyle='rgba(254,240,138,0.18)';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(90,-35);ctx.lineTo(90,35);ctx.closePath();ctx.fill();
 ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,14,18,7,0,0,6.28);ctx.fill();
 ctx.fillStyle=wanted?'#ef4444':'#22c55e';ctx.fillRect(-14,-9,28,18);ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(12,0,6,0,6.28);ctx.fill();ctx.restore();
 for(let ptl of particles){let sx=ptl.x - cam.x,sy=ptl.y - cam.y;ctx.fillStyle=ptl.c;ctx.beginPath();ctx.arc(sx,sy,ptl.r,0,6.28);ctx.fill();}
 mctx.fillStyle='#020617'
