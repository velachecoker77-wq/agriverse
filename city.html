<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FREETOWN CITY V9 - AGRIVERSE METAVERSE 4K</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;font-weight:900}
body{background:#020617;overflow:hidden;height:100dvh;touch-action:none}
canvas{display:block}
.ui{position:fixed;left:0;right:0;z-index:20;pointer-events:none}
.top{top:0;display:flex;justify-content:space-between;padding:6px}
.stat{background:rgba(0,0,0,.8);backdrop-filter:blur(10px);padding:6px 10px;border-radius:14px;font-size:11px;color:#fff;border:1px solid #ffffff22}
.joy{position:fixed;bottom:18px;left:14px;width:120px;height:120px;background:rgba(255,255,255,.08);border:2px solid #ffffff22;border-radius:50%;z-index:20}
.stick{position:absolute;top:50%;left:50%;width:52px;height:52px;background:radial-gradient(white,#e2e8f0);border-radius:50%;transform:translate(-50%,-50%)}
.right{position:fixed;bottom:18px;right:10px;z-index:20;display:flex;flex-direction:column;gap:8px}
.b{width:60px;height:60px;border-radius:50%;border:none;font-size:18px}
#load{position:fixed;inset:0;z-index:99;background:radial-gradient(#1e293b,#020617);display:flex;flex-direction:column;justify-content:end;padding:20px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="load">
<h1 style="font-size:36px;color:#facc15">FREETOWN CITY V9</h1>
<div style="color:#fff;letter-spacing:3px;font-size:11px">4K • THREE.JS • CROPCore FARM • META RAY-BAN READY</div>
<div style="color:#4ade80;font-size:10px;margin-top:6px">LUMLEY BEACH + CITY + FARM METAVERSE</div>
<button onclick="start()" style="margin-top:14px;padding:16px;background:#facc15;border:none;border-radius:14px;width:100%;font-size:16px">🛵 ENTER V9 3D CITY</button>
</div>

<div class="ui top"><div style="display:flex;gap:6px"><div class="stat">❤️100 | ⛽<span id="fuel">100%</span></div><div class="stat" style="color:#facc15">☆☆☆☆☆</div></div><div style="display:flex;gap:6px"><div class="stat">💰 $<span id="cash">154620</span></div><div class="stat" style="background:#16a34a">CropCore</div></div></div>
<div class="ui" style="top:48px;left:8px;right:8px;background:#fffffff2;color:#000;border-radius:12px;padding:8px;border-left:5px solid #16a34a;font-size:11px"><b id="job">📦 Deliver Seeds to Farm</b> <span id="dist" style="float:right;color:#16a34a">0m</span></div>
<div class="joy" id="joy"><div class="stick" id="stick"></div></div>
<div class="right"><button class="b" style="background:#facc15" onclick="toggleView()">👁️</button><button class="b" style="background:#22c55e;color:#fff" onclick="fuel=100">⛽</button></div>

<script type="module">
import * as THREE from 'three';
let scene,camera,renderer,player,ground,target; let keys={x:0,y:0}, fuel=100, cash=154620; let traffic=[], buildings=[];
let camDist=24, camHeight=14, third=true;

function init(){
scene=new THREE.Scene(); scene.background=new THREE.Color(0x87CEEB); scene.fog=new THREE.Fog(0x87CEEB,90,280);
camera=new THREE.PerspectiveCamera(70, innerWidth/innerHeight,0.1,1000);
renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.75));
let sun=new THREE.DirectionalLight(0xffffff,1.2); sun.position.set(60,80,20); sun.castShadow=true; scene.add(sun);

// GROUND - 400x400
ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500), new THREE.MeshStandardMaterial({color:0x16213e})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
// Sand + Road + Sea - HD
let sand=new THREE.Mesh(new THREE.PlaneGeometry(90,500), new THREE.MeshStandardMaterial({color:0xFDE68A})); sand.rotation.x=-Math.PI/2; sand.position.set(-110,0.1,0); scene.add(sand);
let road=new THREE.Mesh(new THREE.PlaneGeometry(44,500), new THREE.MeshStandardMaterial({color:0x0F172A})); road.rotation.x=-Math.PI/2; road.position.set(-40,0.2,0); scene.add(road);
let sea=new THREE.Mesh(new THREE.PlaneGeometry(140,500), new THREE.MeshStandardMaterial({color:0x0A1931})); sea.rotation.x=-Math.PI/2; sea.position.set(-200,0.05,0); scene.add(sea);

// BUILDINGS
function b(x,z,w,h,c){ let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w), new THREE.MeshStandardMaterial({color:c})); m.position.set(x,h/2,z); m.castShadow=true; scene.add(m); buildings.push(m); }
b(25,10,14,22,0xFF6A00); b(45,-20,12,18,0xA855F7); b(0,-50,16,14,0x334155); b(10,-80,12,20,0x1e293b); // Orange, Africell, etc

// CROPCore FARM PATCH - 4K style
let farmGround=new THREE.Mesh(new THREE.PlaneGeometry(80,80), new THREE.MeshStandardMaterial({color:0x3f6212})); farmGround.rotation.x=-Math.PI/2; farmGround.position.set(60,0.15,60); farmGround.receiveShadow=true; scene.add(farmGround);
for(let i=0;i<60;i++){ let crop=new THREE.Mesh(new THREE.BoxGeometry(0.6,2+Math.random()*1.5,0.6), new THREE.MeshStandardMaterial({color:0x4ADE80})); crop.position.set(35+Math.random()*50,1,35+Math.random()*50); crop.castShadow=true; scene.add(crop); }

// PALMS
for(let i=0;i<35;i++){ let trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.5,6,6), new THREE.MeshStandardMaterial({color:0x3F2A14})); let x=-70-Math.random()*60, z=(Math.random()-0.5)*400; trunk.position.set(x,3,z); scene.add(trunk); let leaf=new THREE.Mesh(new THREE.SphereGeometry(1.7,6,6), new THREE.MeshStandardMaterial({color:0x15803D})); leaf.position.set(x,6.4,z); scene.add(leaf); }

// TRAFFIC
for(let i=0;i<16;i++){ let car=new THREE.Mesh(new THREE.BoxGeometry(2.6,1.6,4.8), new THREE.MeshStandardMaterial({color:[0xFACC15,0x38BDF8,0xF87171,0x4ADE80][i%4]})); car.position.set(-40+(Math.random()-0.5)*6,0.9,(Math.random()-0.5)*350); car.castShadow=true; scene.add(car); traffic.push({m:car,s:0.35+Math.random()*0.9}); }

// PLAYER OKADA
player=new THREE.Group(); let bike=new THREE.Mesh(new THREE.BoxGeometry(1.2,1,2.2), new THREE.MeshStandardMaterial({color:0xFACC15})); bike.position.y=0.9; bike.castShadow=true; player.add(bike); let light=new THREE.SpotLight(0xFEF08A,10,50,0.6); light.position.set(0,0.9,1.3); light.target.position.set(0,0,10); player.add(light); player.add(light.target); player.position.set(-40,0,80); scene.add(player);

// TARGET GREEN
target=new THREE.Mesh(new THREE.RingGeometry(3.5,4.5,32), new THREE.MeshBasicMaterial({color:0x22C55E,side:THREE.DoubleSide})); target.rotation.x=-Math.PI/2; target.position.set(60,0.2,60); scene.add(target);
animate();
}
let vx=0,vz=0;
function animate(){ requestAnimationFrame(animate);
let sp=0.4; if(keys.x||keys.y){ let l=Math.hypot(keys.x,keys.y); if(l>1){keys.x/=l; keys.y/=l;} vx+=keys.x*sp*0.12; vz+=keys.y*sp*0.12; player.rotation.y=Math.atan2(vx,vz); fuel=Math.max(0,fuel-0.02*l); }
vx*=0.91; vz*=0.91; player.position.x+=vx; player.position.z+=vz;
for(let t of traffic){ t.m.position.z+=t.s; if(t.m.position.z>200) t.m.position.z=-200; }
let tp=new THREE.Vector3(player.position.x - Math.sin(player.rotation.y)*camDist, camHeight, player.position.z - Math.cos(player.rotation.y)*camDist);
camera.position.lerp(tp,0.08); camera.lookAt(player.position.x,player.position.y+2,player.position.z);
let d=player.position.distanceTo(target.position); document.getElementById('dist').innerText=Math.floor(d)+'m'; document.getElementById('fuel').innerText=Math.floor(fuel)+'%';
if(d<9){ cash+=10; document.getElementById('cash').innerText=cash; target.position.set((Math.random()-0.5)*80,0.2,(Math.random()-0.5)*250); document.getElementById('job').innerText='✅ Delivered! Next Farm'; setTimeout(()=>{document.getElementById('job').innerText='📦 Deliver to CropCore Farm';},1000); }
renderer.render(scene,camera);
}
window.start=()=>{ document.getElementById('load').style.display='none'; init(); };
window.toggleView=()=>{ camDist=camDist>15?8:24; camHeight=camHeight>10?4:14; };
addEventListener('resize',()=>{ if(camera&&renderer){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }});
const joy=document.getElementById('joy'), stick=document.getElementById('stick'); let act=false,o={x:0,y:0};
function ss(e){ act=true; let r=joy.getBoundingClientRect(); let t=e.touches?e.touches[0]:e; o={x:r.left+r.width/2,y:r.top+r.height/2}; }
function sm(e){ if(!act) return; let t=e.touches?e.touches[0]:e; let dx=t.clientX-o.x, dy=t.clientY-o.y; let d=Math.hypot(dx,dy), mx=46; if(d>mx){dx=dx/d*mx; dy=dy/d*mx;} stick.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; keys.x=dx/mx; keys.y=-dy/mx; }
function se(){ act=false; stick.style.transform='translate(-50%,-50%)'; keys.x=0; keys.y=0; }
joy.addEventListener('touchstart',ss,{passive:false}); joy.addEventListener('touchmove',sm,{passive:false}); joy.addEventListener('touchend',se);
joy.addEventListener('mousedown',ss); addEventListener('mousemove',sm); addEventListener('mouseup',se);
</script>
</body>
</html>
