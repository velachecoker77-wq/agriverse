<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agriverse - Moyamba</title><style>body{margin:0;font-family:system-ui;background:#F6F4EF}header{background:#2B2117;color:#fff;padding:18px;text-align:center}h1{margin:0;color:#81C784;font-size:22px}.logo{width:65px;display:block;margin:0 auto 8px;border-radius:50%}.card{background:#fff;margin:12px;padding:14px;border-radius:12px;box-shadow:0 2px 8px #0001}input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}button{background:#2E7D32;color:#fff;border:0;font-weight:700;cursor:pointer}.btn2{background:#1565C0}.btn3{background:#FF6F00}.btn4{background:#6A1B9A}img{width:100%;border-radius:8px;margin-top:8px}table{width:100%;font-size:12px;border-collapse:collapse}th,td{border:1px solid #ddd;padding:6px;text-align:left}.bag{font-family:monospace;background:#E8F5E9;padding:2px 6px;border-radius:4px;font-size:12px}</style></head><body><header><img src="logo.png" class="logo" onerror="this.style.display='none'"><h1>🌱 AGRIVERSE</h1><p>Moyamba Farmers - Bag System + Data Bank</p><p id="gps" style="font-size:11px;color:#A5D6A7">📍 Getting GPS...</p></header>

<div class="card"><h3>👨‍🌾 Farmer + Harvest</h3><input id="farmer" placeholder="Farmer Name e.g. Musa" value=""><select id="crop"><option>Tomatoes</option><option>Rice</option><option>Cassava</option><option>Pepper</option><option>Okra</option><option>Groundnut</option><option>Sweet Potato</option></select><input id="weight" type="number" placeholder="Weight kg e.g. 20"><input id="price" type="number" placeholder="Price Le per kg e.g. 120"><input id="village" placeholder="Village e.g. Moyamba Junction"><input id="photo" type="file" accept="image/*"><button onclick="save()">💾 Save Bag - Create Bag ID</button><p id="msg" style="color:green;font-weight:700"></p></div>

<div class="card"><h3>💰 Monetization</h3><p>My Garden: <b><span id="tot">0</span>kg</b> | Total Value: <b>Le <span id="totval">0</span></b> | Photos: <b><span id="totpic">0</span></b></p><p>Earnings (Photo $): <b style="color:green">Le <span id="earn">0</span></b> <small>(Le 5000 per photo)</small></p><button class="btn2" onclick="exportCSV()">📥 Export to Excel (CSV)</button><button class="btn3" onclick="shareWA()">📲 Sell via WhatsApp</button><button class="btn4" onclick="toggleTable()">📊 View / Hide Data Table</button></div>

<div class="card" id="tableCard" style="display:none"><h3>📊 All Data - For Canon Cloud X</h3><div style="overflow:auto"><table id="dataTable"><thead><tr><th>Bag ID</th><th>Farmer</th><th>Crop</th><th>Kg</th><th>Price</th><th>Village</th><th>GPS</th><th>Time</th></tr></thead><tbody></tbody></table></div></div>

<div class="card"><h3>My Bags</h3><div id="feed">No harvest yet</div></div>

<script>
let h=JSON.parse(localStorage.getItem('ag2')||'[]');let pic='',gpsPos='No GPS';
function getGPS(){if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{gpsPos=p.coords.latitude.toFixed(4)+','+p.coords.longitude.toFixed(4);document.getElementById('gps').innerText='📍 '+gpsPos;},()=>{document.getElementById('gps').innerText='📍 GPS off - enter village manually';});}else{document.getElementById('gps').innerText='📍 GPS not supported';}}getGPS();
photo.onchange=e=>{let r=new FileReader();r.onload=ev=>{pic=ev.target.result};r.readAsDataURL(e.target.files[0])};
function genBag(){return 'AG-MYM-'+Date.now().toString().slice(-6)+'-'+Math.floor(Math.random()*99);}
function save(){let f=farmer.value||'Anonymous',c=crop.value,w=parseFloat(weight.value),p=parseFloat(price.value)||0,v=village.value||'Moyamba';if(!w)return alert('Enter weight kg');let bag=genBag();let obj={bag,f,c,w,p,v,gps:gpsPos,photo:pic,time:new Date().toLocaleString(),ts:Date.now()};h.unshift(obj);localStorage.setItem('ag2',JSON.stringify(h));localStorage.setItem('farmer_name',f);document.getElementById('msg').innerText='✅ Saved Bag '+bag+' - '+c;weight.value='';price.value='';pic='';render();}
function render(){let t=0,tv=0,ht='',rows='';h.forEach(x=>{t+=x.w;tv+=x.w*(x.p||0);rows+=`<tr><td><span class="bag">${x.bag}</span></td><td>${x.f}</td><td>${x.c}</td><td>${x.w}</td><td>${x.p}</td><td>${x.v}</td><td>${x.gps}</td><td>${x.time}</td></tr>`;ht+=`<div style='border-left:4px solid #2E7D32;padding:8px;margin:10px 0;background:#FAFAFA;border-radius:6px'><span class="bag">${x.bag}</span> <b>${x.c} - ${x.w}kg</b> @ Le ${x.p||0}/kg<br><small>👨 ${x.f} | 📍 ${x.v} | ${x.gps}<br>🕒 ${x.time}</small>${x.photo?`<img src='${x.photo}'>`:''}<br><button style="background:#25D366;padding:8px;font-size:12px;margin-top:6px" onclick="sellOne('${x.bag}')">Sell this Bag via WhatsApp</button></div>`});document.getElementById('tot').innerText=t;document.getElementById('totval').innerText=tv.toLocaleString();document.getElementById('totpic').innerText=h.length;document.getElementById('earn').innerText=(h.length*5000).toLocaleString();document.getElementById('feed').innerHTML=ht||'No harvest';document.querySelector('#dataTable tbody').innerHTML=rows||'<tr><td colspan=8>No data</td></tr>';if(localStorage.getItem('farmer_name'))farmer.value=localStorage.getItem('farmer_name');}
function exportCSV(){if(!h.length)return alert('No data to export');let csv='Bag ID,Farmer,Crop,Weight_kg,Price_Le_per_kg,Total_Value_Le,Village,GPS,Time,Timestamp\n';h.forEach(x=>{csv+=`"${x.bag}","${x.f}","${x.c}",${x.w},${x.p},${x.w*(x.p||0)},"${x.v}","${x.gps}","${x.time}",${x.ts}\n`;});let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Agriverse_Moyamba_'+new Date().toISOString().slice(0,10)+'.csv';a.click();alert('✅ Excel CSV downloaded! Open in Excel / Google Sheets. This file is your dataset to monetize.');}
function shareWA(){if(!h.length)return alert('Save harvest first');let last=h[0];let txt=`🌱 AGRIVERSE - FOR SALE%0A%0ABag: ${last.bag}%0AFarmer: ${last.f}%0ACrop: ${last.c}%0AWeight: ${last.w}kg%0APrice: Le ${last.p}/kg%0ATotal: Le ${last.w*(last.p||0)}%0AVillage: ${last.v}%0AGPS: ${last.gps}%0A%0APhoto proof available - Interested?`;window.open('https://wa.me/?text='+txt,'_blank');}
function sellOne(bagId){let x=h.find(o=>o.bag===bagId);if(!x)return;let txt=`🌱 AGRIVERSE BAG FOR SALE%0A%0ABag ID: ${x.bag}%0A${x.c} - ${x.w}kg @ Le ${x.p}/kg = Le ${x.w*(x.p||0)}%0AVillage: ${x.v} - GPS: ${x.gps}%0AFarmer: ${x.f}%0A%0AQR Verified Harvest ✅`;window.open('https://wa.me/?text='+txt,'_blank');}
function toggleTable(){let el=document.getElementById('tableCard');el.style.display=el.style.display==='none'?'block':'none';}
render();
</script></body></html>
