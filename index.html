!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGRIVERSE SL - Bhashini</title><style>body{font-family:sans-serif;background:#fdf8ee;margin:0}.h{background:#00205B;color:#fff;padding:16px}.c{background:#fff;margin:12px;padding:16px;border-radius:16px}input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc}.b{width:100%;padding:14px;border:none;border-radius:12px;background:#0b7a0b;color:#fff;font-weight:800}select{padding:6px 10px;border-radius:8px;background:#ffd700}</style></head><body>
<div class="h"><div style="display:flex;justify-content:space-between"><b>🌿 AGRIVERSE SL</b><select id="L" onchange="T()"><option value="en">English</option><option value="kri" selected>Krio</option><option value="men">Mende</option><option value="tem">Temne</option></select></div><div style="font-size:11px;margin-top:6px">Bhashini Salone • Speak Your Language</div></div>
<div class="c"><h3 id="a">Add Yu Bag</h3><button onclick="V()" style="width:100%;padding:10px;border:1px solid green;border-radius:10px">🎙️ <span id="m">Tok na Krio</span></button><input id="cr" placeholder="Crop - Cassava"><input id="qt" type="number" placeholder="Kg"><input id="pr" type="number" placeholder="Price Le"><input id="vi" placeholder="District"><button class="b" onclick="S()">💾 Save Bag</button><p id="msg"></p></div>
<div class="c"><div>My Bags (<span id="n">0</span>)</div><div id="bags"></div></div>
<script>
let d=JSON.parse(localStorage.getItem('ag')||'[]');function R(){document.getElementById('n').innerText=d.length;document.getElementById('bags').innerHTML=d.map(x=>`<div style="border-bottom:1px solid #eee;padding:8px">${x.cr} - ${x.qt}kg - Le${x.pr} - ${x.vi}</div>`).join('')}R();
function S(){d.push({cr:cr.value,qt:qt.value,pr:pr.value,vi:vi.value,id:'SL-'+Date.now()});localStorage.setItem('ag',JSON.stringify(d));R();msg.innerText='✅ Saved SL-'+Date.now();}
function V(){let r=new(window.SpeechRecognition||window.webkitSpeechRecognition)();r.lang='en';msg.innerText='Listening...';r.onresult=e=>{let t=e.results[0][0].transcript.toLowerCase();msg.innerText='Yu tok: '+t;if(t.includes('cassava'))cr.value='Cassava';let m=t.match(/\d+/);if(m)qt.value=m[0]};r.start()}
function T(){let l=L.value;let o={en:['Add New Bag','Speak to Add'],kri:['Add Yu Bag','Tok na Krio'],men:['Add Bag','Tok Mende'],tem:['Add Bag','Tok Temne']};a.innerText=o[l][0];m.innerText=o[l][1]}
</script></body></html>
