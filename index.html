<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agriverse - Sierra Leone</title>
<style>body{margin:0;font-family:system-ui;background:#F6F4EF}header{background:#2B2117;color:#fff;padding:18px;text-align:center}h1{margin:0;color:#81C784}.card{background:#fff;margin:12px;padding:14px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}button{background:#2E7D32;color:#fff;border:0;font-weight:700}img{width:100%;border-radius:8px;margin-top:8px;max-height:300px;object-fit:cover}.item{border-left:4px solid #2E7D32;padding-left:8px;margin:10px 0}</style>
</head><body>
<header><h1>🌱 AGRIVERSE</h1><p>Offline harvest app for Moyamba farmers</p><small>Born in Moyamba, Sierra Leone - Serving Africa & World</small></header>
<div class="card"><h3>Add Harvest</h3><select id="crop"><option>Tomatoes</option><option>Rice</option><option>Cassava</option><option>Pepper</option><option>Okra</option><option>Groundnut</option></select><input id="weight" type="number" placeholder="Weight kg e.g 10"><input id="photo" type="file" accept="image/*"><img id="prev" style="display:none"><button onclick="save()">💾 Save Harvest (Offline)</button><p id="msg" style="color:#2E7D32;font-weight:bold"></p></div>
<div class="card"><h3>My Garden - Total: <span id="tot">0</span> kg</h3><div id="feed">No harvest yet</div></div>
<script>
let h=JSON.parse(localStorage.getItem('ag')||'[]');let pic='';const ph=document.getElementById('photo');ph.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas');let m=800,w=im.width,hh=im.height;if(w>hh){if(w>m){hh*=m/w;w=m}}else{if(hh>m){w*=m/hh;hh=m}}c.width=w;c.height=hh;c.getContext('2d').drawImage(im,0,0,w,hh);pic=c.toDataURL('image/jpeg',0.7);let p=document.getElementById('prev');p.src=pic;p.style.display='block'};im.src=ev.target.result};r.readAsDataURL(f)});
function save(){let cropV=document.getElementById('crop').value;let wV=parseFloat(document.getElementById('weight').value);if(!wV)return alert('Enter weight');h.unshift({c:cropV,w:wV,photo:pic,time:new Date().toLocaleString()});localStorage.setItem('ag',JSON.stringify(h));document.getElementById('msg').innerText='✅ Saved '+cropV+' '+wV+'kg';document.getElementById('weight').value='';render()}
function render(){let t=0,ht='';h.forEach(x=>{t+=x.w;ht+=`<div class=item><b>${x.c} - ${x.w}kg</b><br><small>${x.time}</small>${x.photo?`<img src='${x.photo}'>`:''}</div>`});document.getElementById('tot').innerText=t.toFixed(1);document.getElementById('feed').innerHTML=ht||'No harvest yet - Add first one above!'}render();
</script></body></html>
