<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGRIVERSE - Sierra Leone</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#fdf8ee;color:#1a3c1a}
.header{background:linear-gradient(135deg,#00205B 0%,#0b7a0b 100%);color:#fff;padding:18px 20px;position:sticky;top:0}
.logo{font-weight:800;font-size:21px}.logo span{color:#ffd700}
.live{background:#ffd700;color:#00205B;padding:4px 12px;border-radius:20px;font-weight:800;font-size:12px}
.hero{padding:24px 18px;text-align:center}
.badge{display:inline-block;background:#00205B;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;margin:3px}
.card-form{background:#fff;border-radius:18px;padding:18px;margin:12px 16px}
.input{width:100%;padding:13px;border-radius:12px;border:1.5px solid #d9d0b0;margin:8px 0}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700}
.btn-save{background:linear-gradient(135deg,#00205B,#0b7a0b);color:#fff}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 16px}
.btn-excel{background:#fff;border:1.5px solid #00205B}.btn-wa{background:#25D366;color:#fff}
.bag-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.07);margin-bottom:14px}
.bag-img{height:170px;object-fit:cover;width:100%}
.bag-id{background:#00205B;color:#ffd700;padding:3px 8px;border-radius:8px;font-size:11px}
</style>
</head>
<body>
<div class="header"><div style="display:flex;justify-content:space-between"><div class="logo">🌿 AGRIVERSE <span>SIERRA LEONE</span></div><div class="live">🇸🇱 LIVE</div></div></div>
<div class="hero"><h1>Track Your Harvest,<br>Earn From Photos</h1><p>Sierra Leone National Farmers Bag System</p><div><span class="badge">Bo</span><span class="badge">Kenema</span><span class="badge">Makeni</span><span class="badge">Moyamba</span><span class="badge">Freetown</span></div></div>
<div class="card-form">
<input id="crop" class="input" placeholder="Crop">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="qty" class="input" placeholder="Qty kg" type="number"><input id="price" class="input" placeholder="Price Le" type="number"></div>
<input id="village" class="input" placeholder="District / Village">
<input id="photo" class="input" type="file" accept="image/*">
<button class="btn btn-save" onclick="saveBag()">💾 Save Bag - National ID ✨</button>
<p id="msg" style="text-align:center;color:#0b7a0b;font-weight:700"></p>
</div>
<div class="btn-grid">
<button class="btn btn-excel" onclick="exportCSV()">📊 Export Excel</button>
<button class="btn btn-wa" onclick="sellWA()">💬 WhatsApp</button>
</div>
<div style="padding:10px 16px 90px"><div>📦 My Bags (<span id="count">0</span>)</div><div id="bags"></div></div>
<script>
let bagsData=JSON.parse(localStorage.getItem('agriverse_sl')||'[]');
function render(){document.getElementById('count').innerText=bagsData.length;const c=document.getElementById('bags');if(!bagsData.length){c.innerHTML='<p style="text-align:center;color:#999;padding:20px">No bags yet - be first in Sierra Leone!</p>';return}c.innerHTML=bagsData.map(b=>`<div class="bag-card"><img class="bag-img" src="${b.img||'https://images.unsplash.com/photo-1542838132-92c53300491e?w=400'}"><div style="padding:12px"><span class="bag-id">🇸🇱 ${b.id}</span><div style="font-weight:800">${b.crop}</div><div>📍 ${b.village} • ${b.qty}kg</div><div style="font-weight:800;color:#00205B">Le ${b.price}</div></div></div>`).reverse().join('');}
render();
function saveBag(){const crop=document.getElementById('crop').value,qty=document.getElementById('qty').value,price=document.getElementById('price').value,village=document.getElementById('village').value;if(!crop||!qty)return alert('Add crop');const file=document.getElementById('photo').files[0];const id='SL-'+Date.now().toString().slice(-6);const reader=new FileReader();reader.onload=function(e){bagsData.push({id,crop,qty,price,village,date:new Date().toISOString(),img:e.target.result});localStorage.setItem('agriverse_sl',JSON.stringify(bagsData));render();document.getElementById('msg').innerText='✅ SL Bag '+id+' Saved!';};if(file)reader.readAsDataURL(file);else reader.onload({target:{result:''}});}
function exportCSV(){let csv='ID,Crop,Qty,Price,Village,Country\n'+bagsData.map(b=>`${b.id},${b.crop},${b.qty},${b.price},${b.village},Sierra Leone`).join('\n');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='agriverse_SL.csv';a.click();}
function sellWA(){let last=bagsData[bagsData.length-1];let text=`🇸🇱 AGRIVERSE SL: ${last.qty}kg ${last.crop} for Le ${last.price} in ${last.village}. ID ${last.id}`;window.open('https://wa.me/?text='+encodeURIComponent(text));}
</script>
</body>
</html>
